[project]
name = "async-todo-api"
version = "0.1.0"
description = "FastAPI Asynchronous Todo and Category API with PostgreSQL and JWT Auth"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",
    "python-dotenv>=1.0.0",
    "pydantic[email]>=2.8.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "flake8>=7.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"